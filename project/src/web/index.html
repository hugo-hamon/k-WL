<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>k-WL Visualization</title>

  <script type="text/javascript" src="/eel.js"></script>
  <script src="//cdn.jsdelivr.net/npm/3d-force-graph"></script>
  <script src="//cdn.jsdelivr.net/npm/force-graph"></script>

  <link href="css/index.css" rel="stylesheet" type="text/css" />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
</head>

<body>
  <h1>k-Weisfeiler-Leman Visualization</h1>

  <div class="controls">
    <div class="top">
      <div class="control-group generate-group">
        <label for="graph-size">Graph Size:</label>
        <input type="number" id="graph-size" value="8" min="2" max="100" />
        <label for="graph-density">Graph Density:</label>
        <input type="number" id="graph-density" value="0.3" min="0" max="1" step="0.05" />
        <button id="generate-btn">Generate Random Graph</button>
      </div>

      <div class="control-group wl-controls">
        <label for="k-value">Test :</label>
        <select id="k-value"><option value="1">1-WL</option><option value="2">2-FWL (paires)</option></select>
        <button id="iterate-btn">Run WL Iteration</button>
      </div>

      <div class="control-group physics-group">
        <button id="toggle-mode-btn">Switch to 2D</button>
        <button id="toggle-physics-btn">Freeze the nodes</button>
      </div>

      <div class="control-group status-group">
        <span id="iteration-info">Iteration: 0</span>
        <span id="status-info" role="status">Status: Ready</span>
      </div>
    </div>
    <div class="bottom">
      <div class="control-group load-group">
        <textarea id="edge-list-input" rows="4" aria-label="Graphes par arêtes ou voisinages" aria-describedby="graph-input-help" placeholder="[(0, 1), (1, 2, 3), (4,)]"></textarea>
        <button id="load-graph-btn">Load from List</button>
        <button id="save-graph-clipboard-btn">Save to clipboard</button>
      </div>
    </div>
    <p id="graph-input-help">Manière d'instancier un graphe -- Arêtes : [(0, 1), (1, 2)] · Voisinages : [(0, 1, 2), (2, 3)]</p>
  </div>

  <div class="container">
    <div id="graph-network"></div>
    <div id="info-panel">
      <h2>Node Information</h2>
      <div id="info-content">Click a node (Left Click) to see details. Right Click to move/rotate.</div>
      <div id="fwl-panel" hidden></div>
      <div id="debug-info"></div>
    </div>
  </div>

  <div class="gallery-section">
    <h2>Galerie de Graphes</h2>
    <div class="gallery-container">
      <!-- Le contenu est généré depuis le JSON -->
    </div>
  </div>

  <script type="module" src="js/index.js"></script>
</body>

</html>
